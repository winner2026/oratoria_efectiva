name: VocalGym audio validation

on:
  push:
    branches:
      - feat/v7-verifiable-coach
  pull_request:
    branches:
      - main
    paths:
      - 'src/infrastructure/audio/**'
      - 'src/domain/voice/VoiceMetrics.ts'
      - 'src/application/analyzeVoice/analyzeVoiceUseCase.ts'
      - 'scripts/verifyAudioMetrics.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/vocalgym-audio-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audio-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run six synthetic audio tests
        run: npm run test:audio-metrics
      - name: Check TypeScript
        run: npx tsc --noEmit
