<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#090d16" stop-opacity="0.95" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  
      <!-- Generic Biometric Silhouette & Soundwaves -->
      <circle cx="100" cy="80" r="34" fill="url(#grad)" opacity="0.9" />
      <path d="M48 168 C 48 126, 70 116, 100 116 C 130 116, 152 126, 152 168 Z" fill="url(#grad)" opacity="0.85" />
      <!-- Scanning waves -->
      <circle cx="100" cy="100" r="76" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="6 8" fill="none" opacity="0.4" />
      <circle cx="100" cy="100" r="88" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 12" fill="none" opacity="0.25" />
      <!-- Mic target reticle -->
      <line x1="100" y1="12" x2="100" y2="28" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
      <line x1="100" y1="172" x2="100" y2="188" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
      <line x1="12" y1="100" x2="28" y2="100" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
      <line x1="172" y1="100" x2="188" y2="100" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" />
    
</svg>