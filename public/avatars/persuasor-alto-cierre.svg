<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1c1305" stop-opacity="0.95" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  
      <!-- Golden Charisma / Deal Closer Vector -->
      <circle cx="100" cy="74" r="30" fill="url(#grad)" />
      <path d="M52 166 C 52 124, 72 112, 100 112 C 128 112, 148 124, 148 166 Z" fill="url(#grad)" opacity="0.9" />
      <!-- Dynamic golden rays & Lightning bolt of conviction -->
      <circle cx="100" cy="100" r="82" stroke="#f59e0b" stroke-width="3" fill="none" opacity="0.7" />
      <path d="M96 32 L88 56 L104 56 L94 82 L112 50 L98 50 Z" fill="#fbbf24" filter="drop-shadow(0 0 6px #f59e0b)" />
      <!-- Golden ascending chevron -->
      <path d="M76 144 L100 128 L124 144" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round" fill="none" />
      <circle cx="100" cy="100" r="92" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="6 12" fill="none" opacity="0.4" />
    
</svg>