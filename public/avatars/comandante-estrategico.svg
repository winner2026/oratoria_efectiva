<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#b91c1c" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1c0808" stop-opacity="0.95" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  
      <!-- Military / Tactical Commander Helmet / Shield -->
      <circle cx="100" cy="74" r="30" fill="url(#grad)" />
      <path d="M50 166 C 50 120, 72 110, 100 110 C 128 110, 150 120, 150 166 Z" fill="url(#grad)" opacity="0.9" />
      <!-- Sharp Tactical Target Reticle -->
      <polygon points="100,16 112,32 88,32" fill="#ef4444" />
      <circle cx="100" cy="100" r="80" stroke="#dc2626" stroke-width="3" stroke-dasharray="16 6" fill="none" />
      <circle cx="100" cy="100" r="90" stroke="#f87171" stroke-width="2" fill="none" opacity="0.4" />
      <!-- Armor Gorget Chevron -->
      <path d="M78 126 L100 144 L122 126" stroke="#fca5a5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M84 140 L100 154 L116 140" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
</svg>