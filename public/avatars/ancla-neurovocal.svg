<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#061026" stop-opacity="0.95" />
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="200" height="200" rx="100" fill="url(#bgGrad)" />
  
      <!-- Deep Diaphragmatic Anchor & Unshakeable Serenity -->
      <circle cx="100" cy="74" r="30" fill="url(#grad)" />
      <path d="M52 166 C 52 124, 72 112, 100 112 C 128 112, 148 124, 148 166 Z" fill="url(#grad)" opacity="0.9" />
      <!-- Solid Heavy Outer Ring -->
      <circle cx="100" cy="100" r="82" stroke="#2563eb" stroke-width="4" fill="none" />
      <circle cx="100" cy="100" r="92" stroke="#60a5fa" stroke-width="1.5" fill="none" opacity="0.4" />
      <!-- Stylized Anchor Emblem in Center -->
      <circle cx="100" cy="40" r="7" stroke="#93c5fd" stroke-width="3" fill="none" />
      <line x1="100" y1="47" x2="100" y2="78" stroke="#93c5fd" stroke-width="3.5" />
      <line x1="86" y1="58" x2="114" y2="58" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" />
      <path d="M80 66 C 80 84, 120 84, 120 66" stroke="#93c5fd" stroke-width="3.5" stroke-linecap="round" fill="none" />
    
</svg>